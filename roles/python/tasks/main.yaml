---
- name: Create the pswd virtualenv and install its packages
  ansible.builtin.pip:
    name: "{{ python_packages }}"
    virtualenv: "{{ python_venv }}"
    virtualenv_command: /usr/bin/python3 -m venv
    state: present

- name: Read the installed ruff version
  ansible.builtin.command:
    argv:
      - "{{ python_ruff_bin }}"
      - --version
  register: python_ruff
  failed_when: false
  changed_when: false

- name: Install the pinned ruff
  ansible.builtin.command:
    argv:
      - "{{ python_uv_bin }}"
      - tool
      - install
      - "ruff=={{ python_ruff_version }}"
  when: not ansible_check_mode and (python_ruff.rc != 0 or python_ruff_version not in python_ruff.stdout)
  changed_when: true

- name: Read the installed pre-commit version
  ansible.builtin.command:
    argv:
      - "{{ python_precommit_bin }}"
      - --version
  register: python_precommit
  failed_when: false
  changed_when: false

- name: Install the pinned pre-commit
  ansible.builtin.command:
    argv:
      - "{{ python_uv_bin }}"
      - tool
      - install
      - "pre-commit=={{ python_precommit_version }}"
  when: not ansible_check_mode and (python_precommit.rc != 0 or python_precommit_version not in python_precommit.stdout)
  changed_when: true
