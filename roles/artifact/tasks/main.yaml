---
- name: Validate artifact inputs
  ansible.builtin.assert:
    that:
      - artifact_name | length > 0
      - artifact_url is match('^https://')
      - artifact_sha256 is match('^[0-9a-f]{64}$')
      - artifact_root is match('^/')
      - artifact_links | length > 0
    fail_msg: "artifact: name, https URL, SHA-256, absolute root, and at least one PATH link are required."

- name: Ensure the user install roots exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ansible_env.HOME }}/.local/opt"
    - "{{ ansible_env.HOME }}/.local/bin"

- name: Create a staging directory
  ansible.builtin.tempfile:
    state: directory
    prefix: "wywy-{{ artifact_name }}."
  register: artifact_stage

- name: Stage and activate the artifact
  block:
    - name: Download the archive
      ansible.builtin.get_url:
        url: "{{ artifact_url }}"
        dest: "{{ artifact_stage.path }}/artifact"
        checksum: "sha256:{{ artifact_sha256 }}"
        mode: "0644"
      when: artifact_archive | bool

    - name: Download the binary
      ansible.builtin.get_url:
        url: "{{ artifact_url }}"
        dest: "{{ artifact_stage.path }}/artifact"
        checksum: "sha256:{{ artifact_sha256 }}"
        mode: "0755"
      when: not artifact_archive | bool

    - name: Create the staged root
      ansible.builtin.file:
        path: "{{ artifact_stage.path }}/root"
        state: directory
        mode: "0755"

    - name: Extract the archive
      ansible.builtin.unarchive:
        src: "{{ artifact_stage.path }}/artifact"
        dest: "{{ artifact_stage.path }}/root"
        remote_src: true
        extra_opts: "{{ ['--strip-components=' ~ artifact_strip_components] if artifact_strip_components | int > 0 else [] }}"
      when: artifact_archive | bool

    - name: Move the binary into the staged root
      ansible.builtin.copy:
        src: "{{ artifact_stage.path }}/artifact"
        dest: "{{ artifact_stage.path }}/root/{{ artifact_name }}"
        remote_src: true
        mode: "0755"
      when: not artifact_archive | bool

    - name: Remove a stale previous root
      ansible.builtin.file:
        path: "{{ artifact_root }}.old"
        state: absent

    - name: Stat the current root
      ansible.builtin.stat:
        path: "{{ artifact_root }}"
      register: artifact_current

    - name: Move the current root aside
      ansible.builtin.command:
        argv:
          - mv
          - -T
          - "{{ artifact_root }}"
          - "{{ artifact_root }}.old"
      when: artifact_current.stat.exists
      changed_when: true

    - name: Activate the staged root
      ansible.builtin.command:
        argv:
          - mv
          - -T
          - "{{ artifact_stage.path }}/root"
          - "{{ artifact_root }}"
      changed_when: true

    - name: Remove the previous root
      ansible.builtin.file:
        path: "{{ artifact_root }}.old"
        state: absent

    - name: Stat every PATH destination
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.local/bin/{{ item.key }}"
      loop: "{{ artifact_links | dict2items }}"
      register: artifact_link_stats

    - name: Fail on a foreign PATH link
      ansible.builtin.assert:
        that:
          - not item.stat.exists or (item.stat.islnk and item.stat.lnk_target == artifact_root ~ '/' ~ item.item.value)
        fail_msg: >-
          Refusing to replace {{ item.item.key }}: it resolves to
          {{ item.stat.lnk_target | default('a non-symlink') }}, expected
          {{ artifact_root }}/{{ item.item.value }}.
      loop: "{{ artifact_link_stats.results }}"

    - name: Create missing PATH links
      ansible.builtin.file:
        src: "{{ artifact_root }}/{{ item.item.value }}"
        dest: "{{ ansible_env.HOME }}/.local/bin/{{ item.item.key }}"
        state: link
        force: false
      loop: "{{ artifact_link_stats.results }}"
      when: not item.stat.exists

  always:
    - name: Remove the staging directory
      ansible.builtin.file:
        path: "{{ artifact_stage.path }}"
        state: absent
